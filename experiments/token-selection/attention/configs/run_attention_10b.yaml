# Attention top-60% (ssToken-adapted causal attention-received).
# RegMix one-epoch (~9.989B catalog / 9.9B budget → 2360 steps) / olmo2_370M /
# permanent ladder {0,125,…,2125,2360} (skip 2250).
# Selection from step 0 (t0_steps=0 / t0_frac=0); no reference model.
# FA-safe: last-layer attention input hook + Q/K recompute (works with attn_backend=auto/flash_2).

run_id: attention-topk-10b-scratch-v1
seed: 42
output_dir: attention/data/attention_10b
arm: attention

methods: [attention_topk]

k: 0.6
# No masking warmup — selection active from step 0.
t0_steps: 0
t0_frac: 0
# Unused by attention_topk (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  dataset_id: pretrain/regmix-10b
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  # One epoch under published train (~9.989B catalog rows); 9.9B → 2360 steps at GBS.
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune per GPU memory (e.g. 16384 on 48 GiB).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  # Wall-clock kernel only (not fingerprinted): auto -> flash_2 if flash_attn works.
  # attention_topk remains FlashAttention-compatible via last-layer hook + Q/K recompute.
  attn_backend: auto
  # Optional pin (single index or comma list). Leave empty under Slurm / when the
  # outer launcher owns CUDA_VISIBLE_DEVICES.
  cuda_visible_devices: ""
  # Informational; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder via shared checkpointer_kwargs_for_ladder (0 + 125-grid + final;
  # omit last on-grid if within 125 of final → skip 2250 for 2360-step runs).
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  pre_train_checkpoint: true
  # Sync save so post-save task_loss hook sees a complete DistCP step dir.
  save_async: false
  # No ephemeral prune — permanent ladder only.
  ephemeral_checkpoint_every_steps: null

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    strict: true
    nproc: null  # launcher TASK_LOSS_NPROC; all training ranks remain paused
    # Relative to experiments/token-selection/; results land under task_loss_results/attention/
    results_dir: task_loss_results/attention
