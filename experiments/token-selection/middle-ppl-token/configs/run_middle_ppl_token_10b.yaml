# Middle-PPL token arm: keep middle 60% by frozen RefHQ late-avg token CE (L_ref).
# Matches middle-ppl-doc offline filter (avg_perplexity under late RefHQ avg).
# Marion et al. (2309.04564): perplexity pruning uses a separate reference model.
# RegMix one-epoch (~9.989B catalog / 9.9B budget → 2360 steps) / olmo2_370M /
# permanent ladder {0,125,…,2125,2360} (skip 2250).
# Selection active from step 0 (t0_steps=0); LR warmup remains 24 steps.
#
# load_path may stay null: --launch auto-materializes late-avg from s3_uris.

run_id: middle-ppl-token-10b-v2
seed: 42
output_dir: middle-ppl-token/data/middle_ppl_token_10b
arm: middle-ppl-token

methods: [middle_ppl]

k: 0.6
# No masking warmup — selection from step 0.
t0_steps: 0
t0_frac: 0.0
# Unused by middle_ppl (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

# Frozen late-avg RefHQ reference (same late avg as learnability-token / middle-ppl-doc).
reference:
  load_path: null
  steps: [1000, 1125, 1315]
  s3_uris:
    - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1000/
    - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1125/
    - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1315/
  dataset: pretrain/refhq-regmix-5p5b

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  dataset_id: pretrain/regmix-10b
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  # One epoch under published train (~9.989B catalog rows); 9.9B → 2360 steps at GBS.
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune per GPU memory (e.g. 16384 on 48 GiB).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  # Wall-clock kernel only (not fingerprinted): auto -> flash_2 if flash_attn works.
  attn_backend: auto
  # Leave empty so CUDA_VISIBLE_DEVICES / Slurm allocator owns the pin.
  cuda_visible_devices: ""
  # Informational only; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder via shared checkpointer_kwargs_for_ladder (interval 125).
  # Saves {0,125,…,2125,2360}; omits 2250. No ephemeral rotation.
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  pre_train_checkpoint: true
  # False so TaskLossEvalCallback sees a complete DistCP step dir before eval.
  save_async: false
  ephemeral_checkpoint_every_steps: null

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    strict: true
    nproc: null  # launcher TASK_LOSS_NPROC; all training ranks remain paused
    # Relative to experiments/token-selection (train_olmo_template ROOT).
    results_dir: task_loss_results/middle-ppl-token
