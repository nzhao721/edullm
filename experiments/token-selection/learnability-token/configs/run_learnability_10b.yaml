# Dual frozen RefHQ refs: early=step250, late=avg(step1000/1125/1315).
# RegMix one-epoch (~9.989B catalog / 9.9B budget → 2360 steps) / olmo2_370M /
# permanent ckpt ladder {0,125,…,2125,2360} (skip 2250).
# Selection active from step 0 (t0_steps=0). New run_id — do not reuse prior arms.
#
# load_path fields may stay null: --launch auto-materializes from s3_uri / s3_uris.
# Optional offline export: python learnability-token/export_learnability_refs.py

run_id: learnability-token-10b-scratch-v1
seed: 42
output_dir: learnability-token/data/learnability_token_10b
arm: learnability-token

methods: [learnability]

k: 0.6
# No masking warmup — selection from step 0 (plan online-scorer contract).
t0_steps: 0
t0_frac: 0
# Unused by learnability (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

# Dual frozen references. Local .pt OR S3 provenance (auto-materialized at --launch).
reference:
  early:
    load_path: null
    step: 250
    s3_uri: s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step250/
  late:
    load_path: null
    steps: [1000, 1125, 1315]
    s3_uris:
      - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1000/
      - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1125/
      - s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1315/
  # Provenance only: RefHQ was trained on published pretrain/refhq-regmix-5p5b.
  dataset: pretrain/refhq-regmix-5p5b

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  dataset_id: pretrain/regmix-10b
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  checkpoint_bucket: edullm-checkpoints
  # Checkpoints + results → s3://edullm-checkpoints/token-sel/learnability-token/
  prefix: token-sel/learnability-token
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  # One epoch under published train (~9.989B catalog rows); 9.9B → 2360 steps at GBS.
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune for HBM (e.g. 16384 on 48 GiB L40S).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  attn_backend: auto
  # Leave empty under Slurm so CUDA_VISIBLE_DEVICES from the allocator wins;
  # for interactive torchrun set a pin (e.g. "0" or "0,1").
  cuda_visible_devices: ""
  # Informational only; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder via shared checkpointer_kwargs_for_ladder (omit 2250 for 2360-step runs).
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  pre_train_checkpoint: true
  # Sync save so post-save task_loss hook sees a complete DistCP step dir.
  save_async: false
  # No ephemeral prune — permanent ladder only.
  ephemeral_checkpoint_every_steps: null

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    # Defaults to <output_dir>/../task_loss_results/<run_id> under the package root.
    results_dir: task_loss_results/learnability-token
