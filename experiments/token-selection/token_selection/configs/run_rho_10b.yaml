# RHO-1 excess-loss from-scratch pretraining (Arm 5).
# RegMix 10B tokens / order contract / scientific knobs shared with the other arms.
# Architecture + corpus match the GPU6/7 CE control (olmo2_370M + RegMix 10B),
# with RHO-1 token selection instead of plain CE.
#
# Reference: final planned checkpoint of the RefHQ 5.5B CE 370M run
#   s3://edullm-olmo-370m-ckpts/edullm-370M-refhq-5p5b/checkpoints/step1315/
#   (planned total_steps=1314; step1625 exists as a later extended save — not used)
# Export to a local model.pt before --launch (see experiments/token-selection/reference/aws/export_refhq_reference.py).

run_id: rho-excess-10b-scratch-v1
seed: 42
output_dir: token_selection/data/rho_10b

methods: [rho_excess]

k: 0.6
t0_frac: 0.02
# Unused by rho_excess (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

# Frozen RHO reference. REQUIRED before --launch (fail closed if null / REPLACE_ME).
# Must be a local path to a .pt/.pth state dict (or a directory containing model.pt).
# Sync + unshard from S3 first; remote s3:// URIs are refused at load time.
reference:
  load_path: null
  # Provenance only (not read by the trainer). Launch scripts fill load_path after export.
  s3_uri: s3://edullm-olmo-370m-ckpts/edullm-370M-refhq-5p5b/checkpoints/step1315/
  step: 1315
  planned_total_steps: 1314
  dataset: s3://edullm-dataset-refhq/refhq-regmix-5p5b-v1/

data:
  tokens_s3: s3://edullm-dataset-regmix/regmix-10b/tokenized
  tokenizer: allenai/dolma2-tokenizer
  sequence_length: 2048

s3:
  dataset_bucket: edullm-dataset-olmo
  checkpoint_bucket: edullm-checkpoints
  prefix: token-selection/rho-excess-10b-scratch-v1
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  max_tokens: 10000000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). B200 often uses 65536; Farmshare L40S (48 GiB)
  # rank_microbatch_size: tune per GPU memory (e.g. 16384 on 48 GiB L40S, 32768+ on B200).
  rank_microbatch_size: 65536
  # Match CE/BLADE stack on the B200 host (HSDP + SkipStepAdamW + compile).
  # Farmshare 4× L40S resume keeps hsdp; torch DCP loads the 8-GPU step200 shards.
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  # Wall-clock kernel only (not fingerprinted): auto -> flash_2 if flash_attn works.
  attn_backend: auto
  # Set by the AWS launcher: single index or comma list (e.g. "6,7").
  # On Slurm/Farmshare leave empty so CUDA_VISIBLE_DEVICES from the allocator wins.
  cuda_visible_devices: ""
  # Informational; torchrun --nproc_per_node is the authority at launch.
  num_gpus: 2
  num_workers: 8
  # total_steps = max_tokens // GBS = 2384; T0 ≈ 48 (t0_frac=0.02)
  checkpoint_every_steps: 250
  checkpoint_keep_last: null
  # Extra permanent at the selection warmup boundary (T0 ≈ 48).
  checkpoint_milestone_steps: [48]
  pre_train_checkpoint: true
  save_async: true
  # Auto-pruned resume snaps; must be < checkpoint_every_steps.
  ephemeral_checkpoint_every_steps: 50

eval:
  block_unit: sequence
  metrics_filename: metrics.json
