# Middle-60% by current-model CE (Arm: middle_ppl).
# RegMix 10B tokens / order contract / scientific knobs shared with the RHO arm.

run_id: middle-ppl-10b-scratch-v1
seed: 42
output_dir: token_selection/data/middle_ppl_10b

methods: [middle_ppl]

k: 0.6
t0_frac: 0.02
# Unused by middle_ppl (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

data:
  tokens_s3: s3://edullm-dataset-regmix/regmix-10b/tokenized
  tokenizer: allenai/dolma2-tokenizer
  sequence_length: 2048

s3:
  dataset_bucket: edullm-dataset-olmo
  checkpoint_bucket: edullm-checkpoints
  prefix: token-selection/middle-ppl-10b-scratch-v1
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  max_tokens: 10000000000
  global_batch_size: 4194304
  lr: 4.0e-4
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Hardware knob (tokens). Tune for HBM once the node is known; not fingerprinted.
  # middle_ppl reuses the train-forward CE (no second scoring forward), so memory is
  # lighter than RHO at the same microbatch; keep the shared default for parity.
  rank_microbatch_size: 65536
  # Required at --launch. Set to an idle physical GPU index on the target host.
  cuda_visible_devices: ""
  num_workers: 8
  checkpoint_every_steps: 250
  checkpoint_keep_last: null
  # Extra permanent at the selection warmup boundary (T0 ≈ 48); the 250-step
  # cadence already covers later analysis points.
  checkpoint_milestone_steps: [48]
  pre_train_checkpoint: true
  save_async: true
  # Auto-pruned resume snaps; must be < checkpoint_every_steps.
  ephemeral_checkpoint_every_steps: 125

eval:
  block_unit: sequence
  metrics_filename: metrics.json
