# RHO-1 excess-loss from-scratch pretraining on RegMix 10B.
# Architecture matches RefHQ CE 370M (TransformerConfig.olmo2_370M).
# Selection: top 60% by excess = L_curr − L_ref from step 0 (t0=0).
#
# Discarded prior run: rho-excess-10b-scratch-v1 (~step200) — do not resume.
#
# Frozen reference: RefHQ 370M step1315
#   s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1315/
# load_path may stay null: --launch auto-materializes DistCP→.pt from s3_uri
# into TOKEN_SELECTION_REF_CACHE (or experiments/token-selection/.cache/refhq).
# Optional override: REFERENCE_LOAD_PATH=/path/to/refhq_step1315_model.pt

run_id: rho-1-regmix10b-v1
seed: 42
output_dir: rho-1/data/rho_10b
arm: rho-1

methods: [rho_excess]

k: 0.6
t0_steps: 0
t0_frac: 0
# Unused by rho_excess (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

# Frozen RHO reference. Local .pt OR s3_uri (auto-materialized at --launch).
# Optional pre-export: python experiments/token-selection/reference/export_refhq_reference.py
reference:
  load_path: null
  s3_uri: s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-5p5b/checkpoints/step1315/
  step: 1315
  planned_total_steps: 1314
  # Provenance only: RefHQ was trained on published pretrain/refhq-regmix-5p5b.
  dataset: pretrain/refhq-regmix-5p5b

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  # Do not use s3://edullm-datasets/ or assume scratch/laptop-local tokens exist.
  dataset_id: pretrain/regmix-10b
  # dataset_version: v1   # optional pin; omit to take resolve_latest
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  checkpoint_bucket: edullm-checkpoints
  # Checkpoints + results → s3://edullm-checkpoints/token-sel/rho-1/
  prefix: token-sel/rho-1
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  # One epoch of published train (~9.989B catalog rows after val carve).
  # Budget 9.9B → 2360 steps at GBS 4_194_304 (stays under per-shard usable; no wrap).
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune per GPU memory (e.g. 16384 on 48 GiB).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  # Wall-clock kernel only (not fingerprinted): auto -> flash_2 if flash_attn works.
  attn_backend: auto
  # Leave empty so CUDA_VISIBLE_DEVICES from the outer launcher / Slurm wins.
  cuda_visible_devices: ""
  # Informational only; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder: {0, 125, …, 2125, 2360} (omit 2250). No ephemeral.
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  ephemeral_checkpoint_every_steps: null
  pre_train_checkpoint: true
  save_async: false

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    results_dir: task_loss_results/rho-1
    # Optional: command_template with {step},{checkpoint},{out},{run_id}
    # Or set TOKEN_SELECTION_TASK_LOSS_EVAL_SCRIPT / TOKEN_SELECTION_TASK_LOSS_CMD.
