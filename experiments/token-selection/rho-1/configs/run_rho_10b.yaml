# RHO-1 excess-loss from-scratch pretraining on RegMix 10B.
# Architecture matches RefHQ CE 370M (TransformerConfig.olmo2_370M).
# Selection: top 60% by excess = L_curr − L_ref from step 0 (t0=0).
#
# Discarded prior run: rho-excess-10b-scratch-v1 (~step200) — do not resume.
#
# Frozen reference: refhq-instruct v3 370M step940
#   s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-instruct-v3/checkpoints/step940/
# This is the reference used by the REPORTED run rho-1-regmix10b-v1
# (W&B eduLLM/token-selection/ebf1fa33048b3459f768cd471c2a8917). The legacy
# refhq-5p5b step1315 reference belongs to a deleted earlier attempt and must
# not be cited; arms.py pins RHO_REFERENCE_CHECKPOINT to the instruct-v3 path.
# load_path may stay null: --launch auto-materializes DistCP→.pt from s3_uri
# into TOKEN_SELECTION_REF_CACHE (or experiments/token-selection/.cache/refhq).
# Optional override: REFERENCE_LOAD_PATH=/path/to/refhq_instruct_v3_step940_model.pt

run_id: rho-1-regmix10b-v1
seed: 42
output_dir: rho-1/data/rho_10b
arm: rho-1

methods: [rho_excess]

k: 0.6
t0_steps: 0
t0_frac: 0
# Unused by rho_excess (no EMA); kept so shared helpers/metrics payloads stay uniform.
alpha_start: 0.99
alpha_end: 0.98

# Frozen RHO reference. Local .pt OR s3_uri (auto-materialized at --launch).
# Optional pre-export: python experiments/token-selection/reference/export_refhq_reference.py
reference:
  load_path: null
  s3_uri: s3://edullm-checkpoints/olmo-370m/edullm-370M-refhq-instruct-v3/checkpoints/step940/
  step: 940
  # Final step of the instruct-v3 reference run. If the reference run record
  # reports a different planned total, take that value; only `step` is
  # load-bearing for materializing the checkpoint.
  planned_total_steps: 940
  # Provenance only: the instruct-v3 reference was trained on the published
  # English-filtered instruct corpus (refhq-new / instruct mix), not on
  # pretrain/refhq-regmix-5p5b.
  dataset: pretrain/refhq-instruct/v3

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  # Do not use s3://edullm-datasets/ or assume scratch/laptop-local tokens exist.
  dataset_id: pretrain/regmix-10b
  # dataset_version: v1   # optional pin; omit to take resolve_latest
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  # NOTE (2026-09-12): this 42 did NOT govern the reported runs. recipe.py sets
  # INIT_SEED = 6198 and the reported runs used 6198; the launch path goes through
  # recipe.py, not this YAML. The value is left at 42 on purpose: the shared
  # contract (token_selection/scripts/experiment_contract.py) requires
  # model.init_seed == the top-level `seed`, and both are fingerprinted for resume,
  # so changing one here would invalidate resume of the existing runs. Treat
  # recipe.py's INIT_SEED = 6198 as authoritative for what actually ran.
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  # Branch head of edullm/token-selection-370m on the edu-llm/OLMo-core fork.
  # Repinned 2026-09-12: the previous pin 99e0009ed67679c90da970ec5ba439c9459e3757 does NOT contain
  # .edullm/token_selection_370m/selection.py, so no selection arm could have
  # run at that revision.
  # NOTE: this pin is stale and did NOT produce the reported runs. See
#       ../../olmo_core_token_selection/PROVENANCE.md, which shows from three
#       code diffs that 98ea67c9 cannot have produced four of the seven arms.
#       The reported runs are pinned to edu-llm/OLMo-core@53daffdf.
  revision: 98ea67c948fd93ccbfd2633e1ae818c3ae1d2ad7

train:
  # One epoch of published pretrain/regmix-10b v1 (realized 10,004,807,041
  # tokens). Budget 9.9B -> 2360 steps at GBS 4_194_304 = 9,898,557,440 tokens,
  # so no second-epoch wrap. Same dataset for all seven arms.
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune per GPU memory (e.g. 16384 on 48 GiB).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  # Wall-clock kernel only (not fingerprinted): auto -> flash_2 if flash_attn works.
  attn_backend: auto
  # Leave empty so CUDA_VISIBLE_DEVICES from the outer launcher / Slurm wins.
  cuda_visible_devices: ""
  # Informational only; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder: {0, 125, …, 2125, 2360} (omit 2250). No ephemeral.
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  ephemeral_checkpoint_every_steps: null
  pre_train_checkpoint: true
  save_async: false

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    strict: true
    nproc: null  # launcher TASK_LOSS_NPROC; all training ranks remain paused
    results_dir: task_loss_results/rho-1
    # Optional: command_template with {step},{checkpoint},{out},{run_id}
    # Or set TOKEN_SELECTION_TASK_LOSS_EVAL_SCRIPT / TOKEN_SELECTION_TASK_LOSS_CMD.
