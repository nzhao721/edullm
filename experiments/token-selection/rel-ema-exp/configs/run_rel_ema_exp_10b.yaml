# REL no-init exponential-α arm (Arm 2).
# Selection: top 60% by REL = L_curr − L_hist from step 0 (t0=0).
# Polarity corrected 2026-09-05: this was originally L_hist − L_curr, inverted
# relative to the rho_excess/BLADE convention. The scorer computes
# current − history; only the 2026-09-05 polarity-corrected re-run is reported
# (W&B eduLLM/token-selection/cc52d5537a03ad8e57cc87a025668b2e).
# EMA: bias-corrected from zero (NO RefHQ / θ0 seed); α(t)=1−exp(−t/300).
# Architecture: RefHQ-matched olmo2_370M. Corpus: RegMix one-epoch
# (pretrain/regmix-10b v1, realized 10,004,807,041 tokens; 9.9B budget → 2360 steps).
# New run_id — do NOT reuse rel-ema-10b-scratch-v1.
#
# Only the EMA seed_mode and α schedule distinguish this arm.

run_id: rel-ema-exp-10b-scratch-v1
seed: 42
output_dir: rel-ema-exp/data/rel_ema_exp_10b
arm: rel-ema-exp

methods: [rel_ema]

k: 0.6
# Selection-mask warmup off: REL active from step 0.
t0_steps: 0
t0_frac: 0.0

# α(t)=1−exp(−t/τ). alpha_start/end are unused under schedule=exp (kept for metrics).
alpha_schedule: exp
alpha_tau: 300
alpha_start: 0.0
alpha_end: 1.0

ema:
  schedule: exp
  tau: 300
  seed_mode: zero   # bias-corrected empty accumulator; never seed from RefHQ

# No frozen reference for this arm (unlike RHO).
reference:
  load_path: null

data:
  # Published+validated corpus (edullm_data.read.resolve_latest / dataset_paths).
  dataset_id: pretrain/regmix-10b
  tokenizer: allenai/dolma2-tokenizer  # same vocab as tokenizer/dolma2-bpe v1
  sequence_length: 2048

s3:
  # Train inputs resolve via data.dataset_id → s3://edullm-data/ (not this field).
  dataset_bucket: edullm-data
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  # NOTE (2026-09-12): this 42 did NOT govern the reported runs. recipe.py sets
  # INIT_SEED = 6198 and the reported runs used 6198; the launch path goes through
  # recipe.py, not this YAML. The value is left at 42 on purpose: the shared
  # contract (token_selection/scripts/experiment_contract.py) requires
  # model.init_seed == the top-level `seed`, and both are fingerprinted for resume,
  # so changing one here would invalidate resume of the existing runs. Treat
  # recipe.py's INIT_SEED = 6198 as authoritative for what actually ran.
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  # Branch head of edullm/token-selection-370m on the edu-llm/OLMo-core fork.
  # Repinned 2026-09-12: the previous pin 99e0009ed67679c90da970ec5ba439c9459e3757 does NOT contain
  # .edullm/token_selection_370m/selection.py, so no selection arm could have
  # run at that revision.
  # NOTE: this pin is stale and did NOT produce the reported runs. See
#       ../../olmo_core_token_selection/PROVENANCE.md, which shows from three
#       code diffs that 98ea67c9 cannot have produced four of the seven arms.
#       The reported runs are pinned to edu-llm/OLMo-core@53daffdf.
  revision: 98ea67c948fd93ccbfd2633e1ae818c3ae1d2ad7

train:
  # One epoch of published pretrain/regmix-10b v1 (realized 10,004,807,041
  # tokens); 9.9B budget -> 2360 steps at GBS = 9,898,557,440 tokens, so no
  # second-epoch wrap. Same dataset for all seven arms.
  max_tokens: 9900000000
  global_batch_size: 4194304
  lr: 4.0e-4
  lr_alpha_f: 0.1
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # Tokens per rank microbatch. GBS must stay divisible by world_size * this.
  # Hardware knob (not fingerprinted). Tune per GPU memory (e.g. 16384 on 48 GiB).
  rank_microbatch_size: 65536
  dp_type: hsdp
  optim_type: skip_step_adamw
  compile_model: true
  z_loss_multiplier: 1.0e-5
  max_grad_norm: 1.0
  attn_backend: auto
  # Leave empty: discover devices from torchrun / CUDA_VISIBLE_DEVICES / Slurm.
  cuda_visible_devices: ""
  # Informational only; torchrun --nproc_per_node is the authority at launch.
  num_gpus: null
  num_workers: 8
  # Permanent ladder via shared checkpointer helper: {0,125,…,2125,2360} (skip 2250).
  checkpoint_every_steps: 125
  checkpoint_keep_last: null
  pre_train_checkpoint: true
  # Default false so task_loss post-save hook sees a complete step dir.
  save_async: false
  # No ephemeral prune.
  ephemeral_checkpoint_every_steps: null

eval:
  block_unit: sequence
  metrics_filename: metrics.json
  task_loss:
    enabled: true
    strict: true
    nproc: null  # launcher TASK_LOSS_NPROC; all training ranks remain paused
    # Relative to experiments/token-selection/ when not absolute.
    # launch_train.sh rewrites this under $RUN_DIR when preparing a runtime YAML.
    results_dir: task_loss_results/rel-ema-exp
