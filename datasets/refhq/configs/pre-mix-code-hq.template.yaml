# HQ reference code pre-mix: RedPajama + secrets filters; copyright span strip only.
# No English lang-id or Gopher/C4 prose rules.
#
# Tagging writes attributes under attributes/<experiment>/ with keys prefixed
# by baseline_v1__. Mixer must load that experiment folder and use the full
# attribute key names for filters and span_replacement.
stream_template:
  name: ""
  documents: []
  attributes:
    - baseline-v1
  output:
    path: ""
    max_size_in_bytes: 1073741824
  filter:
    exclude:
      # Stricter than baseline RedPajama code cuts for HQ reference sampling.
      - "$.attributes[?(@.baseline_v1__code_secrets_v1__doc && @.baseline_v1__code_secrets_v1__doc[0] && @.baseline_v1__code_secrets_v1__doc[0][2] > 0)]"
      - "$.attributes[?(@.baseline_v1__code_redpajama_taggers_v1__avg_line_length_doc && @.baseline_v1__code_redpajama_taggers_v1__avg_line_length_doc[0] && @.baseline_v1__code_redpajama_taggers_v1__avg_line_length_doc[0][2] > 80)]"
      - "$.attributes[?(@.baseline_v1__code_redpajama_taggers_v1__max_line_length_doc && @.baseline_v1__code_redpajama_taggers_v1__max_line_length_doc[0] && @.baseline_v1__code_redpajama_taggers_v1__max_line_length_doc[0][2] > 750)]"
      - "$.attributes[?(@.baseline_v1__code_redpajama_taggers_v1__alnum_prop_doc && @.baseline_v1__code_redpajama_taggers_v1__alnum_prop_doc[0] && @.baseline_v1__code_redpajama_taggers_v1__alnum_prop_doc[0][2] < 0.35)]"
      - "$.attributes[?(@.baseline_v1__code_redpajama_taggers_v1__alpha_token_prop_doc && @.baseline_v1__code_redpajama_taggers_v1__alpha_token_prop_doc[0] && @.baseline_v1__code_redpajama_taggers_v1__alpha_token_prop_doc[0][2] < 2.0)]"
  span_replacement:
    - span: "$.attributes.baseline_v1__code_copyright_comments_v1__copyright_notice"
      min_score: 0.3
      replacement: ""
    - span: "$.attributes.baseline_v1__code_copyright_comments_v1__comment_block"
      min_score: 0.3
      replacement: ""
work_dir:
  input: "${WORK_DIR}/pre-mix-input"
  output: "${WORK_DIR}/pre-mix-output"
processes: ${DOLMA_PROCESSES}
